name: Refresh catalog

on:
  push:
    branches:
      - main
    paths:
      - "config/worker-url.txt"
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read Worker URL
        id: worker
        run: |
          test -s config/worker-url.txt
          printf 'url=%s\n' "$(tr -d '\r\n' < config/worker-url.txt)" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm install

      - name: Build and publish catalog
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
          CATALOG_UPLOAD_SECRET: ${{ secrets.CATALOG_UPLOAD_SECRET }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
        run: npm run refresh:catalog

      - name: Publish static fallback branch
        if: always()
        run: |
          set -euo pipefail

          if test ! -s dist/static/list.m3u8; then
            echo "Static fallback was not generated."
            exit 0
          fi

          mkdir -p /tmp/lista-static
          cp dist/static/list.m3u8 /tmp/lista-static/list.m3u8
          cp dist/static/list-samsung.m3u8 /tmp/lista-static/list-samsung.m3u8
          cp dist/static/status.json /tmp/lista-static/status.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan static-fallback
          git rm -rf . || true

          cp /tmp/lista-static/list.m3u8 ./list.m3u8
          cp /tmp/lista-static/list-samsung.m3u8 ./list-samsung.m3u8
          cp /tmp/lista-static/status.json ./status.json

          git add list.m3u8 list-samsung.m3u8 status.json
          git commit -m "chore: publish static fallback catalog"
          git push --force origin static-fallback

      - name: Upload generated diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ github.run_id }}
          path: |
            dist/catalog/
            dist/static/
          if-no-files-found: ignore
          retention-days: 3
