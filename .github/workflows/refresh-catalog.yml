name: Refresh catalog

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Build and publish catalog
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CATALOG_UPLOAD_SECRET: ${{ secrets.CATALOG_UPLOAD_SECRET }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
        run: npm run refresh:catalog

      - name: Upload generated catalog for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ github.run_id }}
          path: dist/catalog/
          if-no-files-found: ignore
          retention-days: 3
