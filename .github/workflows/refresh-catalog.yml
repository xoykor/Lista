name: Refresh unified list

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "improve/**"
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/refresh-catalog.yml"
  schedule:
    # Uma única checagem a cada 12 horas: compara os HEADs dos upstreams e,
    # quando necessário, regenera e sanitiza a lista.
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unified-list-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout Lista
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Decide whether regeneration is needed
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          saimo_head="$(git ls-remote https://github.com/gabrielsaimo/SaimoPlayer.git refs/heads/main | awk '{print $1}')"
          ramys_head="$(git ls-remote https://github.com/Ramys/Iptv-Brasil-2026.git refs/heads/master | awk '{print $1}')"

          git fetch origin static-fallback --depth=1 || true
          if ! git show origin/static-fallback:status.json > /tmp/previous-status.json 2>/dev/null; then
            printf '{}\n' > /tmp/previous-status.json
          fi

          SAIMO_HEAD="$saimo_head" RAMYS_HEAD="$ramys_head" EVENT_NAME="$EVENT_NAME" node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          let previous = {};
          try {
            previous = JSON.parse(fs.readFileSync("/tmp/previous-status.json", "utf8"));
          } catch {}

          const saimo = process.env.SAIMO_HEAD || "";
          const ramys = process.env.RAMYS_HEAD || "";
          const oldSaimo = previous?.upstream_revisions?.saimo || "";
          const oldRamys = previous?.upstream_revisions?.ramys || "";
          const sourceChanged =
            !oldSaimo || !oldRamys ||
            saimo !== oldSaimo ||
            ramys !== oldRamys;

          const last = Date.parse(previous?.generated_at || "");
          const due12h =
            !Number.isFinite(last) ||
            Date.now() - last >= 12 * 60 * 60 * 1000;

          const forced = ["push", "workflow_dispatch"].includes(
            process.env.EVENT_NAME
          );
          const run = sourceChanged || due12h || forced;

          console.log("run=" + String(run));
          console.log("source_changed=" + String(sourceChanged));
          console.log("due_12h=" + String(due12h));
          console.log("saimo=" + saimo);
          console.log("ramys=" + ramys);
          NODE

      - name: Explain skipped refresh
        if: steps.plan.outputs.run != 'true'
        run: |
          echo "No upstream revision changed since the previous 12-hour check."
          echo "Nothing to rebuild."

      - name: Restore dead-URL quarantine
        if: steps.plan.outputs.run == 'true'
        run: |
          set -euo pipefail
          if ! git show origin/static-fallback:health-cache.json > /tmp/health-cache.json 2>/dev/null; then
            printf '{"dead":{}}\n' > /tmp/health-cache.json
          fi

      - name: Clone SaimoPlayer inputs
        if: steps.plan.outputs.run == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/SaimoPlayer
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/gabrielsaimo/SaimoPlayer.git /tmp/SaimoPlayer
          git -C /tmp/SaimoPlayer sparse-checkout init --cone
          git -C /tmp/SaimoPlayer sparse-checkout set vod
          git -C /tmp/SaimoPlayer checkout

      - name: Clone Ramys inputs
        if: steps.plan.outputs.run == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/Iptv-Brasil-2026
          git clone --depth 1 --filter=blob:none --no-checkout \
            --branch master \
            https://github.com/Ramys/Iptv-Brasil-2026.git /tmp/Iptv-Brasil-2026
          git -C /tmp/Iptv-Brasil-2026 sparse-checkout init --no-cone
          cat > /tmp/ramys-sparse <<'EOF'
          /CanaisBR01.m3u8
          /CanaisBR02.m3u8
          /CanaisBR03.m3u8
          /CanaisBR04.m3u8
          /Filmes-Series.m3u8
          EOF
          git -C /tmp/Iptv-Brasil-2026 sparse-checkout set --stdin < /tmp/ramys-sparse
          git -C /tmp/Iptv-Brasil-2026 checkout

      - name: Test generator
        if: steps.plan.outputs.run == 'true'
        run: |
          npm test
          npm run check

      - name: Build and sanitize one list
        if: steps.plan.outputs.run == 'true'
        env:
          SAIMO_ROOT: /tmp/SaimoPlayer
          RAMYS_ROOT: /tmp/Iptv-Brasil-2026
          SAIMO_REVISION: ${{ steps.plan.outputs.saimo }}
          RAMYS_REVISION: ${{ steps.plan.outputs.ramys }}
          HEALTH_CACHE_PATH: /tmp/health-cache.json
          POOL_SAMPLES: "3"
          POOL_CONCURRENCY: "48"
          ITEM_PROBE_BUDGET: "50000"
          ITEM_CONCURRENCY: "128"
          PROBE_TIMEOUT_MS: "3500"
          MAX_RUNTIME_FALLBACKS: "6"
        run: npm run build

      - name: Validate generated playlist
        if: steps.plan.outputs.run == 'true'
        run: |
          set -euo pipefail
          test -s dist/static/list.m3u8
          test "$(head -n 1 dist/static/list.m3u8)" = "#EXTM3U"

          bytes="$(wc -c < dist/static/list.m3u8)"
          test "$bytes" -lt 104857600

          entries="$(grep -c '^#EXTINF:' dist/static/list.m3u8)"
          test "$entries" -gt 1000
          grep -qi ',Loki S01E01$' dist/static/list.m3u8

          fallback_entries="$(grep -c 'x-lista-fallback=' dist/static/list.m3u8 || true)"
          if test "$fallback_entries" -gt 0; then
            test -n "$(find dist/static/fallback -type f -name '*.json' -print -quit)"
            grep -q '^#EXT-X-LISTA-FALLBACK:https://raw.githubusercontent.com/xoykor/Lista/static-fallback/fallback
      - name: Publish changed generated state
        if: >
          steps.plan.outputs.run == 'true' &&
          github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          mkdir -p /tmp/lista-publish
          cp dist/static/list.m3u8 /tmp/lista-publish/list.m3u8
          cp dist/static/status.json /tmp/lista-publish/status.json
          cp dist/static/health-cache.json /tmp/lista-publish/health-cache.json
          cp -R dist/static/fallback /tmp/lista-publish/fallback
          cp -R dist/static/cards /tmp/lista-publish/cards

          old_list_hash=""
          old_status_hash=""
          old_cache_hash=""
          if git show origin/static-fallback:list.m3u8 > /tmp/old-list.m3u8 2>/dev/null; then
            old_list_hash="$(sha256sum /tmp/old-list.m3u8 | awk '{print $1}')"
          fi
          if git show origin/static-fallback:status.json > /tmp/old-status.json 2>/dev/null; then
            old_status_hash="$(sha256sum /tmp/old-status.json | awk '{print $1}')"
          fi
          if git show origin/static-fallback:health-cache.json > /tmp/old-health-cache.json 2>/dev/null; then
            old_cache_hash="$(sha256sum /tmp/old-health-cache.json | awk '{print $1}')"
          fi

          new_list_hash="$(sha256sum /tmp/lista-publish/list.m3u8 | awk '{print $1}')"
          new_status_hash="$(sha256sum /tmp/lista-publish/status.json | awk '{print $1}')"
          new_cache_hash="$(sha256sum /tmp/lista-publish/health-cache.json | awk '{print $1}')"

          if test "$new_list_hash" = "$old_list_hash" && \
             test "$new_status_hash" = "$old_status_hash" && \
             test "$new_cache_hash" = "$old_cache_hash"; then
            echo "Playlist, metadata and quarantine are unchanged; publication skipped."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan static-publish
          git rm -rf . || true

          cp /tmp/lista-publish/list.m3u8 ./list.m3u8
          cp /tmp/lista-publish/status.json ./status.json
          cp /tmp/lista-publish/health-cache.json ./health-cache.json
          cp -R /tmp/lista-publish/fallback ./fallback
          cp -R /tmp/lista-publish/cards ./cards

          git add list.m3u8 status.json health-cache.json fallback cards
          git commit -m "chore: regenerate unified self-healing list"
          git push --force origin HEAD:static-fallback

      - name: Upload diagnostics
        if: always() && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unified-list-${{ github.run_id }}
          path: |
            dist/static/status.json
            dist/static/list.m3u8
          if-no-files-found: ignore
          retention-days: 3
 dist/static/list.m3u8
          fi

          if grep -RqiE 'workers\.dev|/channel/' dist/static; then
            echo "ERRO: referência a Worker encontrada nos artefatos estáticos"
            exit 1
          fi

          echo "playlist: $entries entries, $bytes bytes, $fallback_entries static fallbacks"

      - name: Publish changed generated state
        if: >
          steps.plan.outputs.run == 'true' &&
          github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          mkdir -p /tmp/lista-publish
          cp dist/static/list.m3u8 /tmp/lista-publish/list.m3u8
          cp dist/static/status.json /tmp/lista-publish/status.json
          cp dist/static/health-cache.json /tmp/lista-publish/health-cache.json
          cp -R dist/static/fallback /tmp/lista-publish/fallback
          cp -R dist/static/cards /tmp/lista-publish/cards

          old_list_hash=""
          old_status_hash=""
          old_cache_hash=""
          if git show origin/static-fallback:list.m3u8 > /tmp/old-list.m3u8 2>/dev/null; then
            old_list_hash="$(sha256sum /tmp/old-list.m3u8 | awk '{print $1}')"
          fi
          if git show origin/static-fallback:status.json > /tmp/old-status.json 2>/dev/null; then
            old_status_hash="$(sha256sum /tmp/old-status.json | awk '{print $1}')"
          fi
          if git show origin/static-fallback:health-cache.json > /tmp/old-health-cache.json 2>/dev/null; then
            old_cache_hash="$(sha256sum /tmp/old-health-cache.json | awk '{print $1}')"
          fi

          new_list_hash="$(sha256sum /tmp/lista-publish/list.m3u8 | awk '{print $1}')"
          new_status_hash="$(sha256sum /tmp/lista-publish/status.json | awk '{print $1}')"
          new_cache_hash="$(sha256sum /tmp/lista-publish/health-cache.json | awk '{print $1}')"

          if test "$new_list_hash" = "$old_list_hash" && \
             test "$new_status_hash" = "$old_status_hash" && \
             test "$new_cache_hash" = "$old_cache_hash"; then
            echo "Playlist, metadata and quarantine are unchanged; publication skipped."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan static-publish
          git rm -rf . || true

          cp /tmp/lista-publish/list.m3u8 ./list.m3u8
          cp /tmp/lista-publish/status.json ./status.json
          cp /tmp/lista-publish/health-cache.json ./health-cache.json
          cp -R /tmp/lista-publish/fallback ./fallback
          cp -R /tmp/lista-publish/cards ./cards

          git add list.m3u8 status.json health-cache.json fallback cards
          git commit -m "chore: regenerate unified self-healing list"
          git push --force origin HEAD:static-fallback

      - name: Upload diagnostics
        if: always() && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unified-list-${{ github.run_id }}
          path: |
            dist/static/status.json
            dist/static/list.m3u8
          if-no-files-found: ignore
          retention-days: 3
