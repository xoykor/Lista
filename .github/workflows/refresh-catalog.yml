name: Refresh catalog

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read Worker URL
        id: worker
        run: |
          test -s config/worker-url.txt
          printf 'url=%s\n' "$(tr -d '\r\n' < config/worker-url.txt)" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm install

      - name: Build and publish catalog
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
          CATALOG_UPLOAD_SECRET: ${{ secrets.CATALOG_UPLOAD_SECRET }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
        run: npm run refresh:catalog

      - name: Upload generated diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ github.run_id }}
          path: dist/catalog/
          if-no-files-found: ignore
          retention-days: 3
