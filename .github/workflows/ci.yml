name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm test
      - run: npm run check
