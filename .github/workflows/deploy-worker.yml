name: Deploy Worker

on:
  push:
    branches:
      - main
    paths-ignore:
      - "config/worker-url.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.135.0"

      - name: Install
        run: npm install

      - name: Upload Worker secrets after deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          CATALOG_UPLOAD_SECRET: ${{ secrets.CATALOG_UPLOAD_SECRET }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({TOKEN_SECRET:String(process.env.TOKEN_SECRET||\"\").trim(),CATALOG_UPLOAD_SECRET:String(process.env.CATALOG_UPLOAD_SECRET||\"\").trim()}))' | npx wrangler secret bulk

      - name: Save Worker URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          mkdir -p config
          printf '%s\n' "$DEPLOYMENT_URL" > config/worker-url.txt

      - name: Commit Worker URL when changed
        run: |
          if test -z "$(git status --porcelain -- config/worker-url.txt)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/worker-url.txt
          git commit -m "chore: update deployed Worker URL"
          git push

      - name: Build and publish initial catalog
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          CATALOG_UPLOAD_SECRET: ${{ secrets.CATALOG_UPLOAD_SECRET }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
        run: npm run refresh:catalog

      - name: Deep health scan
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          npm run scan:502 -- --url "$WORKER_URL/list.m3u8" --rescan --concurrency 32 --timeout 6000
          npm run scan:502 -- --url "$WORKER_URL/list.m3u8" --file dist/health-scan/source.m3u8 --retry-unknown --concurrency 16 --timeout 12000
          npm run scan:502 -- --url "$WORKER_URL/list.m3u8" --file dist/health-scan/source.m3u8 --retry-unknown --concurrency 8 --timeout 20000

      - name: Publish deep-cleaned catalog
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
          CATALOG_UPLOAD_SECRET: ${{ secrets.CATALOG_UPLOAD_SECRET }}
        run: npm run publish:filtered

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-scan-${{ github.run_id }}
          path: dist/health-scan/
          if-no-files-found: ignore
          retention-days: 3
